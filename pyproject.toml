[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "imbalance-hub"
version = "0.1.0"
description = "Client for the curated catalog of imbalanced time series."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
classifiers = ["License :: OSI Approved :: MIT License"]
dependencies = [
    "pandas",
    "numpy",
    "huggingface_hub",
    "pyarrow",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["imbalance_hub"]
