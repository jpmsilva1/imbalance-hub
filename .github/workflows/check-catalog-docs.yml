name: Check catalog docs

on:
  pull_request:
    paths:
      - catalog/series.csv
      - catalog/filter_reference.json
      - README.md
      - dataset_card.md

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python scripts/check_catalog_docs.py
